// Read by Kerbal Changelog, which shows this in-game after an update.
// Mirrors CHANGELOG.md at the repository root; keep the two in step when
// cutting a release.
//
// CHANGE type is one of: HighPriority, Add, Change, Deprecate, Remove, Fix,
// Security, Performance. Only the first letter is significant.

KERBALCHANGELOG
{
	modName = Dimension Sync
	author = Clarence "Sparr" Risher
	license = MIT
	website = https://github.com/sparr/ksp-mod-DimensionSync

	VERSION
	{
		version = 0.2.0.0
		versionKSP = 1.12.5

		CHANGE
		{
			type = Add
			change = Hollow parts
			subchange = A part's bore and its outside diameter can follow one another, under the hollowCoupling setting.
			subchange = hard, the default, never moves the bore; a change that will not fit around it stops short and leaves the mismatch visible.
			subchange = soft gives up exactly the room the outside needs and no more, so the outside can follow the stack the whole way.
			subchange = proportional keeps the bore the same fraction of the outside; constant keeps the wall its thickness.
			subchange = A hollow cone keeps each end's pair of diameters separate.
		}
		CHANGE
		{
			type = Add
			change = A stack can be built to a bore as well as to an outside
			subchange = The two diameters match each other across a joint, so a plug sized to the tank above it follows when that tank's bore moves.
			subchange = Inside a single part they still cannot set one another, because their values are never equal.
		}
		CHANGE
		{
			type = Add
			change = Parts nested inside a bore keep their clearance
			subchange = Move the bore and the part inside follows; resize the part and the bore makes room.
			subchange = The same four hollowCoupling modes decide how much either gives.
			subchange = Recognised from any of the four end-plane pairings being flush, so a part turned end for end or slid to the far end of the bore still counts.
			subchange = Nested parts need neither a shared axis nor matching diameters; the coplanar surface is the criterion.
		}
		CHANGE
		{
			type = Add
			change = Other mods are asked what they changed
			subchange = Recovers what a field held before somebody else wrote it, which decides whether a part is left where it was put or rearranged.
			subchange = One hook on KSP's own BaseField.SetValue covers ProceduralParts, ROLib and stock; B9 Procedural Wings gets a second because it bypasses that seam.
			subchange = Needs Harmony and is entirely optional. Without it the mod behaves exactly as before.
		}
		CHANGE
		{
			type = Add
			change = Hollow coupling is on the settings window
			subchange = The four modes, with worked examples, beside the margin and wing settings.
			subchange = What you pick is saved to PluginData/Settings.cfg like the rest.
		}
		CHANGE
		{
			type = Fix
			change = Mirrored control surfaces no longer drift apart
			subchange = A mirrored pair ended 0.0625 m apart along identical wings whenever their parent wing was shortened.
			subchange = B9 writes the mirrored side's value and its own cache together, so that side never experienced a change and its two rules disagreed about what the surface measured beforehand.
		}
		CHANGE
		{
			type = Fix
			change = Control surfaces stay fitted to their wing
			subchange = Refitted when the wing's thickness changes, and kept coplanar through a change to the parent's span.
			subchange = The edge a surface sits on is remembered rather than re-derived, so it stays on the one it was placed on.
			subchange = A player's move is adopted before the rules run, and KSP's stored offset updated when it is accepted.
			subchange = Where only one edge of a joint lines up, the offset is spent rather than the chord.
		}
	}

	VERSION
	{
		version = 0.1.0.0
		versionKSP = 1.12.5

		CHANGE
		{
			type = Add
			change = Diameters stay in step along a stack
			subchange = Changing a procedural part's diameter pushes the new size up and down the stack.
			subchange = Propagation stops at the first part whose facing end was a different size than the changed part was before the change.
			subchange = Stock parts, radially attached parts and anything the player cannot edit are left alone.
		}
		CHANGE
		{
			type = Add
			change = Chord and thickness stay in step along a wing
			subchange = A procedural wing segment's tip dimensions carry to the root of the segment outboard of it.
			subchange = Chord, thickness and the leading and trailing edge widths are separate channels and never cross over.
			subchange = Sweeping or lengthening a segment moves the segment outboard of it back onto its tip, keeping its shape.
			subchange = A control surface takes its thickness and length from the wing it lies on, at its own stations if it covers only part of the span.
			subchange = A control surface turns and moves to follow the wing edge it is on when that edge becomes swept.
			subchange = A control surface that gets longer grows away from the fuselage rather than through it.
		}
		CHANGE
		{
			type = Add
			change = A settings window on the editor toolbar
			subchange = Margin mode, match tolerance and the two wing behaviours can be changed in game without editing config.
			subchange = Choices are saved to PluginData/Settings.cfg and take precedence over DimensionSync.cfg.
		}
		CHANGE
		{
			type = Add
			change = Mod support out of the box
			subchange = ProceduralParts
			subchange = ROLib - RO-Tanks, RO-Capsules, RO-Heatshields
			subchange = SSTU and its forks
			subchange = Procedural Fairings
			subchange = B9 Procedural Wings, all forks
		}
		CHANGE
		{
			type = Add
			change = Anything else can be added from config
			subchange = DimensionSync.cfg holds a catalogue of dimension fields that ModuleManager can patch, so supporting another mod needs no code change.
			subchange = passThroughRigidParts, off by default, lets a part with no dimension of its own stop blocking propagation.
		}
	}
}
