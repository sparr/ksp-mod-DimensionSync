// Read by Kerbal Changelog, which shows this in-game after an update.
// Mirrors CHANGELOG.md at the repository root; keep the two in step when
// cutting a release.
//
// CHANGE type is one of: HighPriority, Add, Change, Deprecate, Remove, Fix,
// Security, Performance. Only the first letter is significant.

KERBALCHANGELOG
{
	modName = Dimension Sync
	author = Clarence "Sparr" Risher
	license = MIT
	website = https://github.com/sparr/ksp-mod-DimensionSync

	VERSION
	{
		version = 0.1.0.0
		versionKSP = 1.12.5

		CHANGE
		{
			type = Add
			change = Diameters stay in step along a stack
			subchange = Changing a procedural part's diameter pushes the new size up and down the stack.
			subchange = Propagation stops at the first part whose facing end was a different size than the changed part was before the change.
			subchange = Stock parts, radially attached parts and anything the player cannot edit are left alone.
		}
		CHANGE
		{
			type = Add
			change = Chord and thickness stay in step along a wing
			subchange = A procedural wing segment's tip dimensions carry to the root of the segment outboard of it.
			subchange = Chord, thickness and the leading and trailing edge widths are separate channels and never cross over.
			subchange = Sweeping or lengthening a segment moves the segment outboard of it back onto its tip, keeping its shape.
			subchange = A control surface takes its thickness and length from the wing it lies on, at its own stations if it covers only part of the span.
			subchange = A control surface turns and moves to follow the wing edge it is on when that edge becomes swept.
			subchange = A control surface that gets longer grows away from the fuselage rather than through it.
		}
		CHANGE
		{
			type = Add
			change = A settings window on the editor toolbar
			subchange = Margin mode, match tolerance and the two wing behaviours can be changed in game without editing config.
			subchange = Choices are saved to PluginData/Settings.cfg and take precedence over DimensionSync.cfg.
		}
		CHANGE
		{
			type = Add
			change = Mod support out of the box
			subchange = ProceduralParts
			subchange = ROLib - RO-Tanks, RO-Capsules, RO-Heatshields
			subchange = SSTU and its forks
			subchange = Procedural Fairings
			subchange = B9 Procedural Wings, all forks
		}
		CHANGE
		{
			type = Add
			change = Anything else can be added from config
			subchange = DimensionSync.cfg holds a catalogue of dimension fields that ModuleManager can patch, so supporting another mod needs no code change.
			subchange = passThroughRigidParts, off by default, lets a part with no dimension of its own stop blocking propagation.
		}
	}
}
