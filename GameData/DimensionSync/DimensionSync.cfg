// DimensionSync settings and dimension-field catalogue.
//
// Other mods (or you) can add fields with a ModuleManager patch:
//
//	@DIMENSION_SYNC:FOR[MyMod]
//	{
//		FIELD
//		{
//			module = MyResizer
//			field = tankDiameter
//		}
//	}
//
// Note that KSP's config parser needs each node's braces on their own lines;
// a one-line "FIELD { module = X  field = Y }" is silently read as a single
// nonsense value.
//
// FIELD keys:
//   module   PartModule class name. Omit to match the field on any module.
//   field    KSPField name.
//   isRadius true when the field holds a radius rather than a diameter.
//   channel  Which quantity this is. Dimensions only sync with dimensions on the
//            same channel. Built-in names: outer (default), inner, width,
//            thickness, span, edgeLeading, edgeTrailing, offset. Any other name
//            works.
//   link     Which kinds of joint the dimension travels over, as a list:
//              stack  parts joined by a pair of axial attach nodes (default)
//              span   parts joined end to end, one surface-attached at the
//                     other's tip, as procedural wing segments are chained
//              edge   parts lying side by side, one surface-attached along the
//                     other's flank, as a control surface sits on a wing
//            e.g. "link = span, edge" for a dimension that does both. A change
//            arriving end to end may carry through to the part's far end; one
//            arriving side by side may not, because each end of that joint is
//            its own connection.
//   spanAxis x (default), y or z: the part-local axis running root to tip. Used
//            to tell an end-to-end joint from a side-by-side one, by whether the
//            surface node faces along that axis or across it.
//   ends     both (default), top/tip, bottom/root, or none. Which end of the
//            part the field describes. For a stack part top and bottom are its
//            own +Y and -Y; for a wing the root is the end attached to its
//            parent. Across a side-by-side joint root meets root and tip meets
//            tip; across an end-to-end one the child's root meets the parent's
//            tip.
//   mirrored true when the two sides of a joint hold equal and opposite values
//            rather than equal ones. Mirrored dimensions never carry through a
//            part to its far end.
//   requiresEditorControl
//            false for fields a mod drives from its own window instead of the
//            part action window, so they are hidden and have no UI control.
//   requireGuiUnits
//            Only treat the field as this dimension while its guiUnits match.
//   requireTrue / requireFalse
//            Name a sibling boolean KSPField that has to hold that value for the
//            dimension to count at all, e.g. "requireFalse = isCtrlSrf".
//   enabled  false to make DimensionSync ignore the field.

DIMENSION_SYNC
{
	// Log every tracked field, every change and every propagation step.
	debug = true

	// How far apart two parts may be and still count as the same size, as a
	// fraction of the larger of them. Parts that were meant to match are rarely
	// identical to the last decimal, so a run should not stop dead because a
	// neighbour is a hundredth of a metre out. 0.01 is one percent.
	tolerance = 0.01

	// What to do about a neighbour that was near, but not exactly, the same size.
	// Say a 3.00 m tank next to a 3.02 m one, and the 3.00 goes to 6.00:
	//   none          the gap is closed and the neighbour lands on 6.00
	//   absolute      the gap is kept as an amount, landing on 6.02
	//   proportional  the gap is kept as a ratio, landing on 6.04
	// Every part in a run measures its own gap against the part that actually
	// changed, so the margins do not compound along the stack.
	marginMode = none

	// The smallest movement in a field that counts as a change at all. Far below
	// the match tolerance on purpose: a slider dragged in millimetre steps has to
	// be noticed, even though a millimetre is well inside "the same size".
	changeEpsilon = 0.0001

	// When true, a part with nothing on the channel being propagated (a stock
	// decoupler in a run of procedural tanks, say) does not stop propagation;
	// the change carries on to whatever is attached on its far side.
	passThroughRigidParts = false

	// Keep a control surface's sweep matched to the wing carrying it, using the
	// same formula as B9 Procedural Wings' own "inherit" button. Without this a
	// flap stops meeting the wing at the tip as soon as the wing's tip chord
	// changes, because B9 stores a control surface's offset as a rate - so many
	// metres of sweep per metre of span - rather than as a distance, and the
	// wing's own offset cannot simply be copied across.
	matchControlSurfaceSweep = true

	// Keep a part that runs alongside its host on the same stretch of it when its
	// span changes. B9 grows a control surface from its middle, so a flap that
	// gets longer would otherwise put half its new length back toward the
	// fuselage; with this on, an aileron on the outboard half of a wing is still
	// on the outboard half after the wing has been lengthened.
	anchorSpanChanges = true

	// Move a wing segment back onto the tip of the segment inboard of it when that
	// segment is swept or lengthened. B9's own "inherit base" button closes this
	// joint the other way round, by shearing the neighbour's root to match, which
	// changes a planform the player chose; this keeps the neighbour's shape and
	// moves it instead.
	alignWingJoints = true

	// Carry a chord change on through a run of wing segments whose edges form one
	// straight line. Whether a chord crosses a joint is decided by the two parts
	// being the same size, which is right for a stack of tanks and wrong for a
	// wing: a delta built from three tapering segments has no two chords the same
	// anywhere, and yet its leading edge is a single straight line. Narrowing one
	// segment leaves a kink in that line, and stopping there leaves the kink. With
	// this on, the change carries out to the tip and the shape survives.
	keepWingEdgesStraight = true
}

// The margin mode, the match tolerance and the four wing settings above can also
// be changed in game, from the DimensionSync button on the editor toolbar. What
// you choose there is written to
// GameData/DimensionSync/PluginData/Settings.cfg and takes precedence over the
// values here.
